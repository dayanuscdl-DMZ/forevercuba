    page.innerHTML =
      '<a class="back" href="index.html#provincias">← ' + esc(T("back")) + '</a>' +
      '<div class="pv-hero"><div>' +
        '<p class="eyebrow">' + esc(isSpecial ? T("special") : T("prov")) + '</p>' +
        '<h1>' + esc(p.n) + '</h1><p class="pv-cap">' + esc(T("capital")) + ': ' + esc(p.cap) + '</p>' +
        '<p class="pv-lead">' + esc(L_.lead) + '</p>' +
        '<div class="pv-actions"><a class="btn primary" href="index.html#rentas">' + esc(T("see_houses")) + '</a>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + wa(T("m_plan", { p: p.n })) + '">' + esc(T("plan")) + '</a></div>' +
      '</div><div id="pvMap" role="img" aria-label="' + esc(p.n) + '"></div></div>' +
      '<section><div class="sec-head"><h2>' + esc(T("photos_h")) + '</h2></div>' + photos + '</section>' +
      '<section><div class="sec-head"><h2>' + esc(T("hist_h")) + '</h2></div><p class="pv-text">' + esc(L_.hist) + '</p></section>' +
      '<section><div class="sec-head"><h2>' + esc(T("places_h")) + '</h2></div><div class="places">' + L_.lug.map(function (l) {
        return '<article class="place">' + PIN + '<h3>' + esc(l[0]) + '</h3><p>' + esc(l[1]) + '</p></article>';
      }).join("") + '</div></section>' +
      '<section><div class="sec-head"><h2>' + esc(T("testi_h")) + '</h2></div><div class="testi"><span class="cam">' + CAM + '</span>' +
        '<h3>' + esc(T("testi_t", { p: p.n })) + '</h3><p>' + esc(T("testi_p")) + '</p>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + wa(T("m_photos", { p: p.n })) + '">' + esc(T("testi_btn")) + '</a></div></section>' +
      '<section><div class="sec-head"><h2>' + esc(T("others_h")) + '</h2></div><div class="chips-pv" role="navigation" aria-label="' + esc(T("others_h")) + '">' + P.map(function (o) {
        return '<a href="provincia.html?p=' + o.s + '"' + (o === p ? ' aria-current="page"' : '') + '>' + esc(o.n) + '</a>';
      }).join("") + '</div><div class="pv-nav"><a class="btn small" href="provincia.html?p=' + prev.s + '">← ' + esc(prev.n) + '</a><a class="btn small" href="provincia.html?p=' + next.s + '">' + esc(next.n) + ' →</a></div></section>';
    drawMap();
  }

  function drawMap() {
    if (!window.L) return;
    if (pvMap) { pvMap.remove(); pvMap = null; }
    pvMap = L.map("pvMap", { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, zoomSnap: 0.1 });
    pvMap.fitBounds([[19.75, -85.0], [23.3, -74.1]]);
    fetch("provincias.json").then(function (r) { return r.json(); }).then(function (geo) {
      var mine = null;
      L.geoJSON(geo, {
        style: function (f) { var on = f.properties.n === prov.geo; return { color: "#FFFFFF", weight: 1.2, fillColor: on ? "#E31C5F" : "#E7E1DA", fillOpacity: on ? 1 : 0.95 }; },
        onEachFeature: function (f, layer) {
          if (f.properties.n === prov.geo) mine = f;
          layer.on("click", function () { var o = P.filter(function (x) { return x.geo === f.properties.n; })[0]; if (o) location.href = "provincia.html?p=" + o.s; });
        }
      }).addTo(pvMap);
      if (mine) L.tooltip({ permanent: true, direction: "top", className: "prov-label", offset: [0, -4] }).setLatLng([mine.properties.lat, mine.properties.lng]).setContent(prov.n).addTo(pvMap);
    }).catch(function () {});
  }

  /* Visor de fotos */
  function openLb(i) { lbIndex = i; $("#lb").hidden = false; document.body.style.overflow = "hidden"; showLb(); }
  function closeLb() { $("#lb").hidden = true; document.body.style.overflow = ""; }
  function showLb() { var f = prov.fotos; lbIndex = (lbIndex + f.length) % f.length; $("#lbImg").src = f[lbIndex]; $("#lbImg").alt = prov.n; $("#lbCount").textContent = (lbIndex + 1) + " / " + f.length; }
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-ph]"); if (b) openLb(+b.getAttribute("data-ph")); });
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function () { lbIndex--; showLb(); });
  $("#lbNext").addEventListener("click", function () { lbIndex++; showLb(); });
  document.addEventListener("keydown", function (e) { if ($("#lb").hidden) return; if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") { lbIndex--; showLb(); } else if (e.key === "ArrowRight") { lbIndex++; showLb(); } });

  /* Día / Noche */
  var root = document.documentElement, tb = $("#themeBtn");
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function paintTheme() { var d = root.getAttribute("data-theme") === "dark"; tb.innerHTML = d ? SUN + " " + esc(T("day")) : MOON + " " + esc(T("night")); tb.setAttribute("aria-label", d ? T("to_day") : T("to_night")); }
  function setTheme(t) { root.setAttribute("data-theme", t); paintTheme(); try { localStorage.setItem("fc-theme", t); } catch (e) {} }
  var st = "light"; try { st = localStorage.getItem("fc-theme") || "light"; } catch (e) {}
  setTheme(st === "dark" ? "dark" : "light");
  tb.addEventListener("click", function () { setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  /* Idioma */
  function applyLang(l) {
    lang = TX[l] ? l : "es"; root.setAttribute("lang", lang); FC.guardarIdioma(lang);
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T(el.getAttribute("data-i18n")); });
    document.querySelectorAll(".lang").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    paintTheme(); render();
  }
  document.querySelectorAll(".lang").forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });

  var slug = new URLSearchParams(location.search).get("p") || "la-habana";
  prov = P.filter(function (x) { return x.s === slug; })[0] || null;
  applyLang(lang);
})();
</script>
</body>
</html>
