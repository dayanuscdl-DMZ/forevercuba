        ["health", "Santé", ["Apportez un répulsif anti-moustiques : il y a des cas de dengue et d'autres maladies transmises par les moustiques.", "Apportez vos médicaments et une trousse de secours, car les médicaments manquent à Cuba.", "Utilisez de la crème solaire et buvez de l'eau en bouteille.", "Aucun vaccin n'est exigé, sauf si vous venez d'une zone de fièvre jaune."]],
        ["bag", "Que mettre dans la valise", ["Un adaptateur universel : Cuba a des prises de type américain et européen.", "Vêtements légers, sandales et de quoi vous protéger de la pluie.", "Produits d'hygiène et objets du quotidien : on ne les trouve pas toujours.", "Une copie de votre passeport et de votre assurance, sur papier et sur votre téléphone."]],
        ["sun", "Quand partir", ["Saison sèche : de novembre à mars, la plus agréable et la plus demandée.", "Saison des pluies : de mai à octobre, plus chaude et humide.", "La saison des ouragans va de juin à novembre : prévoyez un plan B et une assurance qui la couvre."]],
        ["shield", "Sécurité", ["Cuba est un pays relativement sûr et les crimes violents sont rares.", "Méfiez-vous des pickpockets, des faux changeurs et des vendeurs de cigares dans la rue.", "Ne portez pas de bijoux et ne montrez pas d'objets de valeur.", "La nuit, dans les grandes villes, prenez un taxi."]],
        ["heart", "Soyez patient", ["Les règles et les services à Cuba peuvent changer sans prévenir.", "Gardez un itinéraire flexible et un plan B.", "Les Cubains sont très accueillants : un sourire ouvre beaucoup de portes."]]
      ] }
  };
  var lang = FC.idioma(), esc = FC.esc;

      '</ul></section>' +

  var root = document.documentElement, tb = $("#themeBtn");
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function paintTheme() { var d = root.getAttribute("data-theme") === "dark"; tb.innerHTML = d ? SUN + " " + esc(T("day")) : MOON + " " + esc(T("night")); tb.setAttribute("aria-label", d ? T("to_day") : T("to_night")); }
  function setTheme(t) { root.setAttribute("data-theme", t); paintTheme(); try { localStorage.setItem("fc-theme", t); } catch (e) {} }

    lang = TX[l] ? l : "es"; root.setAttribute("lang", lang); FC.guardarIdioma(lang);
