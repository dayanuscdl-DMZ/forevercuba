<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel ForeverCuba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
body { background: var(--teal-soft); }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; }
.bar .who { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tag-panel { font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.panel { max-width: 980px; margin: 0 auto; padding-block: 28px 60px; display: grid; gap: 20px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 16px; min-width: 0; }
.box h1 { font-size: 1.6rem; }
.box h2 { font-size: 1.25rem; }
.row-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.login { max-width: 440px; margin: 60px auto; }
.msg { padding: 12px 14px; border-radius: 12px; background: var(--teal-soft); font-weight: 600; }
.msg.bad { color: var(--coral); }
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 14px; }
.item img { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--teal-soft); display: block; }
.item h3 { font-size: 1rem; }
.item .meta { font-size: .88rem; }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pill.on { background: #DDF3E4; color: #1F6B3A; }
.pill.off { background: var(--line); color: var(--muted); }
.form { display: grid; gap: 14px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 14px; }
textarea { min-height: 120px; }
.help { color: var(--muted); font-size: .85rem; font-weight: 500; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.checks label { display: flex; align-items: center; gap: 8px; font-weight: 500; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.checks input { width: auto; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 12px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ph { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--teal-soft); }
.ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.ph .cover { position: absolute; top: 6px; left: 6px; background: var(--coral); color: #fff; font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.ph .tools { display: flex; justify-content: space-between; padding: 4px; background: var(--surface); }
.ph .tools button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; width: 32px; height: 28px; cursor: pointer; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--coral); color: var(--fg); }
.save-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: #FDECEC; color: #8A1C1C; font-weight: 600; }
.team { display: grid; gap: 8px; }
.team div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; }
.inline input { flex: 1 1 220px; width: auto; }
@media (max-width: 560px) {
  .item { grid-template-columns: 72px minmax(0, 1fr); }
  .item img { width: 72px; height: 56px; }
  .item .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
.vip-check { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FFF8E1; border: 1.5px solid #E2C35A; cursor: pointer; }
.vip-check input { width: auto; accent-color: #B8901E; }
.vip-check b { color: #8A6A00; }
.pill.vip { background: #1A1711; color: #E2C35A; }
.sols { display: grid; gap: 14px; }
.sol { border: 1px solid var(--line); border-left: 4px solid #E31C5F; border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.sol.done { border-left-color: var(--line); opacity: .75; }
.sol-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sol-head h3 { font-size: 1.1rem; }
.sol-contact { margin: 0; font-weight: 600; }
.sol-contact a { color: inherit; }
.sol-msg { white-space: pre-wrap; font-family: inherit; margin: 0; background: var(--bg); border-radius: 10px; padding: 12px; font-size: .92rem; line-height: 1.5; }
.sol .acts { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <a class="brand" href="index.html" style="flex-direction:row;gap:10px"><span class="word">Forever<span>Cuba</span></span></a>
  <div class="who"><span class="tag-panel">Panel del equipo</span><span id="who"></span><button class="btn small" id="logout" hidden>Salir</button></div>
</div></div>

<main class="wrap" id="app"><p class="panel meta">Cargando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="comun.js"></script>
<script>
(function () {
  var esc = FC.esc, app = document.getElementById("app");
  function $(s, r) { return (r || document).querySelector(s); }
  if (!FC.conectado()) { app.innerHTML = '<div class="panel"><div class="box"><h1>Panel sin conectar</h1><p>Falta poner los datos de Supabase en el archivo comun.js.</p></div></div>'; return; }
  var sb = supabase.createClient(FC.CONFIG.url, FC.CONFIG.key);
  var user = null, props = [], editing = null, photos = [], pendingDelete = null, tab = "sols", lugares = [], autos = [], sols = [];
  var CIUDADES = ["Habana Vieja", "Centro Habana", "Vedado", "Miramar", "Playa", "Varadero", "Viñales", "Trinidad", "Cienfuegos", "Santa Clara", "Camagüey", "Santiago de Cuba", "Holguín", "Baracoa", "Cayo Coco", "Cayo Santa María"];

  /* ---------- Entrar ---------- */
  function showLogin(note, bad) {
    $("#who").textContent = ""; $("#logout").hidden = true;
    app.innerHTML = '<div class="box login"><h1>Entrar al panel</h1>' +
      '<p class="help" style="font-size:1rem">Escribe tu correo. Te enviamos un enlace para entrar, sin contraseña.</p>' +
      (note ? '<p class="msg' + (bad ? ' bad' : '') + '">' + esc(note) + '</p>' : '') +
      '<form id="loginForm" class="form"><label for="email">Correo<input id="email" type="email" required autocomplete="email" placeholder="tucorreo@gmail.com"></label>' +
      '<button class="btn primary" type="submit">Enviarme el enlace</button></form></div>';
    $("#loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = $("#email").value.trim(), btn = $("#loginForm button");
      btn.disabled = true; btn.textContent = "Enviando…";
      sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
        if (r.error) { showLogin("No se pudo enviar el enlace: " + r.error.message, true); return; }
        showLogin("Listo. Revisa tu correo (" + email + ") y toca el enlace que te enviamos. Si no aparece, mira en Spam o Promociones.");
      });
    });
  }

  sb.auth.onAuthStateChange(function (ev, session) {
    var u = session && session.user;
    if (u && (!user || user.id !== u.id)) { user = u; start(); }
    if (!u && user) { user = null; showLogin(); }
  });
  sb.auth.getSession().then(function (r) { if (r.data.session) { user = r.data.session.user; start(); } else showLogin(); });
  $("#logout").addEventListener("click", function () { sb.auth.signOut(); });

  function start() {
    $("#who").textContent = user.email; $("#logout").hidden = false;
    sb.rpc("es_equipo").then(function (r) {
      if (!r.data) { app.innerHTML = '<div class="box login"><h1>Sin acceso</h1><p class="msg bad">El correo ' + esc(user.email) + ' no está en el equipo. Pide a alguien del equipo que lo agregue.</p></div>'; return; }
      loadList();
    });
  }

  /* ---------- Lista de propiedades ---------- */
  function loadList(note) {
    sb.from("propiedades").select("*").order("orden").order("creado", { ascending: false }).then(function (r) {
      if (r.error) { app.innerHTML = '<div class="panel"><p class="msg bad">Error al cargar: ' + esc(r.error.message) + '</p></div>'; return; }
      props = r.data || []; showList(note);
    });
  }
  function tabs() {
    return '<div class="chips" role="tablist" style="margin-bottom:4px"><button type="button" class="chip" data-act="tab" data-tab="sols" aria-pressed="' + (tab === "sols") + '">📩 Solicitudes</button><button type="button" class="chip" data-act="tab" data-tab="props" aria-pressed="' + (tab === "props") + '">Casas y apartamentos</button>' +
      '<button type="button" class="chip" data-act="tab" data-tab="autos" aria-pressed="' + (tab === "autos") + '">Renta de autos</button>' +
      '<button type="button" class="chip" data-act="tab" data-tab="lugares" aria-pressed="' + (tab === "lugares") + '">★ Nuestros lugares Forever</button></div>';
  }
  function showList(note) {
    if (tab === "lugares") { loadLugares(note); return; }
    if (tab === "autos") { loadAutos(note); return; }
    if (tab === "sols") { loadSols(note); return; }
    editing = null;
    var items = props.map(function (p) {
      var del = pendingDelete === p.id ? '<div class="confirm" style="grid-column:1/-1">¿Borrar "' + esc(p.titulo_es) + '" para siempre? <button class="btn small" data-act="del-yes" data-id="' + p.id + '">Sí, borrar</button><button class="btn small" data-act="del-no">No</button></div>' : '';
      return '<div class="item"><img src="' + esc(FC.foto(p)) + '" alt="">' +
        '<div><h3>' + esc(p.titulo_es) + '</h3><p class="meta">' + esc(p.tipo) + ' · ' + esc(p.ciudad) + ' · $' + p.precio + ' por noche · ' + (p.fotos || []).length + ' fotos</p>' +
        '<span class="pill ' + (p.publicado ? 'on">Publicada' : 'off">Oculta') + '</span>' + (p.vip ? ' <span class="pill vip">★ VIP</span>' : '') + '</div>' +
        '<div class="acts"><a class="btn small" href="casa.html?id=' + p.id + '" target="_blank">Ver</a><button class="btn small" data-act="edit" data-id="' + p.id + '">Editar</button>' +
        '<button class="btn small" data-act="toggle" data-id="' + p.id + '">' + (p.publicado ? 'Ocultar' : 'Publicar') + '</button>' +
        '<button class="btn small" data-act="del" data-id="' + p.id + '">Borrar</button></div>' + del + '</div>';
    }).join("");
    app.innerHTML = '<div class="panel">' + tabs() + (note ? '<p class="msg">' + esc(note) + '</p>' : '') +
      '<div class="box"><div class="row-head"><h1>Casas y apartamentos</h1><button class="btn primary" data-act="new">+ Agregar propiedad</button></div>' +
      (props.length ? '<div class="list">' + items + '</div>' : '<p class="help" style="font-size:1rem">Todavía no hay propiedades. Mientras tanto la página muestra las de ejemplo. Toca <b>Agregar propiedad</b> para subir la primera; en cuanto haya una publicada, las de ejemplo desaparecen.</p>') +
      '</div>' + teamBox() + '</div>';
    loadTeam();
  }

  /* ---------- Equipo ---------- */
  function teamBox() {
    return '<div class="box"><h2>Equipo con acceso</h2><p class="help">Las personas de esta lista pueden entrar al panel con su correo.</p><div class="team" id="team"></div>' +
      '<form class="inline" id="teamForm"><input id="teamEmail" type="email" required placeholder="correo@ejemplo.com" aria-label="Correo nuevo"><button class="btn small" type="submit">Agregar al equipo</button></form><p class="help" id="teamMsg"></p></div>';
  }
  function loadTeam() {
    sb.from("equipo").select("email").order("email").then(function (r) {
      var box = $("#team"); if (!box) return;
      box.innerHTML = (r.data || []).map(function (t) {
        var me = t.email.toLowerCase() === (user.email || "").toLowerCase();
        return '<div><span>' + esc(t.email) + (me ? ' <span class="help">(tú)</span>' : '') + '</span>' + (me ? '' : '<button class="btn small" data-act="team-del" data-email="' + esc(t.email) + '">Quitar</button>') + '</div>';
      }).join("");
    });
    var f = $("#teamForm");
    if (f) f.addEventListener("submit", function (e) {
      e.preventDefault();
      var em = $("#teamEmail").value.trim().toLowerCase();
      sb.from("equipo").insert({ email: em }).then(function (r) {
        $("#teamMsg").textContent = r.error ? "No se pudo agregar: " + r.error.message : em + " ya puede entrar al panel con su correo.";
        $("#teamEmail").value = ""; loadTeam();
      });
    });
  }

  /* ---------- Formulario ---------- */
  function showForm(p) {
    editing = p ? p.id : "new";
    p = p || { tipo: "Casa", ciudad: "", titulo_es: "", titulo_en: "", titulo_fr: "", desc_es: "", desc_en: "", desc_fr: "", habitaciones: 1, banos: 1, personas: 2, precio: "", comodidades: ["wifi", "ac", "agua"], fotos: [], publicado: true, orden: 0 };
    photos = (p.fotos || []).map(function (u) { return { url: u }; });
    var amen = Object.keys(FC.AMEN).map(function (k) {
      return '<label><input type="checkbox" name="amen" value="' + k + '"' + ((p.comodidades || []).indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(FC.AMEN[k].es) + '</label>';
    }).join("");
    app.innerHTML = '<div class="panel"><div class="box"><div class="row-head"><h1>' + (editing === "new" ? "Agregar propiedad" : "Editar propiedad") + '</h1><button class="btn small" data-act="back">← Volver a la lista</button></div>' +
      '<form class="form" id="pf">' +
      '<div class="g2"><label for="fTipo">Tipo<select id="fTipo"><option value="Casa">Casa</option><option value="Apartamento">Apartamento</option></select></label>' +
      '<label for="fCiudad">Ciudad o barrio<input id="fCiudad" list="ciudades" required value="' + esc(p.ciudad) + '" placeholder="Ej. Vedado"><datalist id="ciudades">' + CIUDADES.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + '</datalist></label></div>' +
      '<label for="fTit">Nombre de la propiedad<input id="fTit" required value="' + esc(p.titulo_es) + '" placeholder="Ej. Casa colonial con patio interior"></label>' +
      '<label for="fDesc">Descripción<textarea id="fDesc" placeholder="Cómo es el lugar, qué hay cerca, qué la hace especial…">' + esc(p.desc_es) + '</textarea></label>' +
      '<details' + (p.titulo_en || p.titulo_fr ? ' open' : '') + '><summary>Inglés y francés (opcional)</summary><div class="form">' +
        '<p class="help">Si lo dejas vacío, se muestra el texto en español.</p>' +
        '<label for="fTitEn">Nombre en inglés<input id="fTitEn" value="' + esc(p.titulo_en) + '"></label>' +
        '<label for="fDescEn">Descripción en inglés<textarea id="fDescEn">' + esc(p.desc_en) + '</textarea></label>' +
        '<label for="fTitFr">Nombre en francés<input id="fTitFr" value="' + esc(p.titulo_fr) + '"></label>' +
        '<label for="fDescFr">Descripción en francés<textarea id="fDescFr">' + esc(p.desc_fr) + '</textarea></label>' +
      '</div></details>' +
      '<div class="g4"><label for="fPrecio">Precio por noche (USD)<input id="fPrecio" type="number" min="0" required value="' + esc(p.precio) + '"></label>' +
      '<label for="fPers">Personas<input id="fPers" type="number" min="1" required value="' + esc(p.personas) + '"></label>' +
      '<label for="fHab">Habitaciones<input id="fHab" type="number" min="0" required value="' + esc(p.habitaciones) + '"></label>' +
      '<label for="fBan">Baños<input id="fBan" type="number" min="0" required value="' + esc(p.banos) + '"></label></div>' +
      '<div><p style="font-weight:600;margin-bottom:8px">Qué ofrece</p><div class="checks">' + amen + '</div></div>' +
      '<div><p style="font-weight:600;margin-bottom:4px">Fotos</p><p class="help" style="margin-bottom:10px">La primera foto es la portada. Usa las flechas para cambiar el orden.</p>' +
        '<div class="photos" id="phs"></div>' +
        '<label class="drop" id="drop" for="fFotos" style="margin-top:10px;display:block;cursor:pointer">Toca aquí para elegir fotos, o arrástralas aquí<input id="fFotos" type="file" accept="image/*" multiple hidden></label></div>' +
'<label class="vip-check"><input id="fVip" type="checkbox"' + (p.vip ? ' checked' : '') + '> <span><b>★ VIP</b> — aparece en las páginas de Servicio VIP</span></label>' +
      '<label style="display:flex;align-items:center;gap:10px;font-weight:600"><input id="fPub" type="checkbox" style="width:auto"' + (p.publicado ? ' checked' : '') + '> Publicada (se ve en la página)</label>' +
      '<div class="save-bar"><button class="btn primary" type="submit" id="saveBtn">Guardar</button><button class="btn" type="button" data-act="back">Cancelar</button><span class="help" id="saveMsg" role="status"></span></div>' +
      '</form></div></div>';
    $("#fTipo").value = p.tipo;
    drawPhotos();
    $("#fFotos").addEventListener("change", function (e) { addFiles(e.target.files); e.target.value = ""; });
    var d = $("#drop");
    ["dragenter", "dragover"].forEach(function (t) { d.addEventListener(t, function (e) { e.preventDefault(); d.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (t) { d.addEventListener(t, function (e) { e.preventDefault(); d.classList.remove("over"); }); });
    d.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });
    $("#pf").addEventListener("submit", save);
    window.scrollTo(0, 0);
  }
  function drawPhotos() {
    var box = $("#phs"); if (!box) return;
    box.innerHTML = photos.map(function (ph, i) {
      return '<div class="ph"><img src="' + esc(ph.preview || ph.url) + '" alt="">' + (i === 0 ? '<span class="cover">Portada</span>' : '') +
        '<div class="tools"><button type="button" data-act="ph-left" data-i="' + i + '" aria-label="Mover a la izquierda">←</button>' +
        '<button type="button" data-act="ph-del" data-i="' + i + '" aria-label="Quitar foto">✕</button>' +
        '<button type="button" data-act="ph-right" data-i="' + i + '" aria-label="Mover a la derecha">→</button></div></div>';
    }).join("");
  }
  function addFiles(list) {
    Array.prototype.forEach.call(list, function (f) {
      if (!/^image\//.test(f.type)) return;
      photos.push({ file: f, preview: URL.createObjectURL(f) });
    });
    drawPhotos();
  }
  function shrink(file) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { res(b || file); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { res(file); };
      img.src = URL.createObjectURL(file);
    });
  }
  function upload(ph, i, folder) {
    if (!ph.file) return Promise.resolve(ph.url);
    return shrink(ph.file).then(function (blob) {
      var path = folder + "/" + Date.now() + "-" + i + ".jpg";
      return sb.storage.from("fotos").upload(path, blob, { contentType: "image/jpeg", upsert: false }).then(function (r) {
        if (r.error) throw r.error;
        return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
      });
    });
  }
  function save(e) {
    e.preventDefault();
    var btn = $("#saveBtn"), msg = $("#saveMsg");
    var nuevos = photos.filter(function (p) { return p.file; }).length;
    btn.disabled = true; msg.textContent = nuevos ? "Subiendo " + nuevos + " foto(s)…" : "Guardando…";
    var folder = editing === "new" ? "p-" + Date.now() : editing;
    var chain = Promise.resolve(), urls = [];
    photos.forEach(function (ph, i) { chain = chain.then(function () { return upload(ph, i, folder).then(function (u) { urls[i] = u; ph.url = u; delete ph.file; }); }); });
    chain.then(function () {
      var row = {
        tipo: $("#fTipo").value, ciudad: $("#fCiudad").value.trim(),
        titulo_es: $("#fTit").value.trim(), desc_es: $("#fDesc").value.trim(),
        titulo_en: $("#fTitEn").value.trim() || null, desc_en: $("#fDescEn").value.trim() || null,
        titulo_fr: $("#fTitFr").value.trim() || null, desc_fr: $("#fDescFr").value.trim() || null,
        precio: +$("#fPrecio").value || 0, personas: +$("#fPers").value || 1, habitaciones: +$("#fHab").value || 0, banos: +$("#fBan").value || 0,
        comodidades: Array.prototype.map.call(document.querySelectorAll('input[name="amen"]:checked'), function (c) { return c.value; }),
        fotos: urls.filter(Boolean), publicado: $("#fPub").checked, vip: $("#fVip").checked
      };
      var q = editing === "new" ? sb.from("propiedades").insert(row) : sb.from("propiedades").update(row).eq("id", editing);
      return q.then(function (r) { if (r.error) throw r.error; loadList('Guardado: "' + row.titulo_es + '". Ya ' + (row.publicado ? 'se ve en la página.' : 'está guardada (oculta).')); });
    }).catch(function (err) {
      btn.disabled = false; msg.textContent = "No se pudo guardar: " + (err.message || err) + ". Inténtalo otra vez."; drawPhotos();
    });
  }

  /* ---------- Nuestros lugares Forever ---------- */

        '<span class="pill ' + (p.publicado ? 'on">Publicado' : 'off">Oculto') + '</span>' + (p.vip ? ' <span class="pill vip">★ VIP</span>' : '') + '</div>' +
        '<div class="acts"><button class="btn small" data-act="ledit" data-id="' + p.id + '">Editar</button>' +
        '<button class="btn small" data-act="ltoggle" data-id="' + p.id + '">' + (p.publicado ? 'Ocultar' : 'Publicar') + '</button>' +
        '<button class="btn small" data-act="ldel" data-id="' + p.id + '">Borrar</button></div>' + del + '</div>';
    }).join("");

      '<div class="box"><div class="row-head"><h1>Nuestros lugares Forever</h1><div class="inline"><a class="btn small" href="lugares.html" target="_blank">Ver página</a><button class="btn primary" data-act="lnew">+ Agregar lugar</button></div></div>' +
      '<p class="help" style="font-size:1rem">Restaurantes, bares, cafés y lugares que el equipo recomienda. Aparecen en la página "Nuestros lugares Forever".</p>' +
      (lugares.length ? '<div class="list">' + items + '</div>' : '<p class="help" style="font-size:1rem">Todavía no hay lugares. Mientras tanto la página muestra una lista de ejemplo; en cuanto publiques el primero, la de ejemplo desaparece.</p>') +
      '</div></div>';
  }
  function showLugarForm(p) {
    lugEditing = p ? p.id : "new";
    p = p || { nombre: "", categoria: "restaurante", ciudad: "", direccion: "", desc_es: "", tip_es: "", desc_en: "", tip_en: "", desc_fr: "", tip_fr: "", foto: null, publicado: true };
    lugFoto = p.foto ? { url: p.foto } : null;
    app.innerHTML = '<div class="panel"><div class="box"><div class="row-head"><h1>' + (lugEditing === "new" ? "Agregar lugar" : "Editar lugar") + '</h1><button class="btn small" data-act="lback">← Volver</button></div>' +
      '<form class="form" id="lf">' +
      '<label for="lNombre">Nombre del lugar<input id="lNombre" required value="' + esc(p.nombre) + '" placeholder="Ej. La Guarida"></label>' +
      '<div class="g2"><label for="lCat">Tipo<select id="lCat">' + Object.keys(CATS).map(function (k) { return '<option value="' + k + '">' + CATS[k] + '</option>'; }).join("") + '</select></label>' +
      '<label for="lCiudad">Ciudad<input id="lCiudad" list="ciudades2" required value="' + esc(p.ciudad) + '" placeholder="Ej. La Habana"><datalist id="ciudades2">' + ["La Habana", "Varadero", "Viñales", "Trinidad", "Cienfuegos", "Santa Clara", "Camagüey", "Holguín", "Santiago de Cuba", "Baracoa"].map(function (c) { return '<option value="' + c + '">'; }).join("") + '</datalist></label></div>' +
      '<label for="lDir">Dirección (opcional)<input id="lDir" value="' + esc(p.direccion || "") + '" placeholder="Ej. Concordia 418, Centro Habana"></label>' +
      '<label for="lDesc">Descripción<textarea id="lDesc" placeholder="Cómo es el lugar y por qué lo recomiendan">' + esc(p.desc_es || "") + '</textarea></label>' +
      '<label for="lTip">Nuestro consejo (opcional)<input id="lTip" value="' + esc(p.tip_es || "") + '" placeholder="Ej. Reserva con tiempo y sube a la terraza"></label>' +
      '<details' + (p.desc_en || p.desc_fr ? ' open' : '') + '><summary>Inglés y francés (opcional)</summary><div class="form"><p class="help">Si lo dejas vacío, se muestra el texto en español.</p>' +
        '<label for="lDescEn">Descripción en inglés<textarea id="lDescEn">' + esc(p.desc_en || "") + '</textarea></label><label for="lTipEn">Consejo en inglés<input id="lTipEn" value="' + esc(p.tip_en || "") + '"></label>' +
        '<label for="lDescFr">Descripción en francés<textarea id="lDescFr">' + esc(p.desc_fr || "") + '</textarea></label><label for="lTipFr">Consejo en francés<input id="lTipFr" value="' + esc(p.tip_fr || "") + '"></label></div></details>' +
      '<div><p style="font-weight:600;margin-bottom:8px">Foto</p><div class="photos" id="lph"></div>' +
        '<label class="drop" for="lFoto" style="margin-top:10px;display:block;cursor:pointer">Toca aquí para elegir una foto<input id="lFoto" type="file" accept="image/*" hidden></label></div>' +
'<label class="vip-check"><input id="lVip" type="checkbox"' + (p.vip ? ' checked' : '') + '> <span><b>★ VIP</b> — aparece en las páginas de Servicio VIP</span></label>' +
      '<label style="display:flex;align-items:center;gap:10px;font-weight:600"><input id="lPub" type="checkbox" style="width:auto"' + (p.publicado ? ' checked' : '') + '> Publicado (se ve en la página)</label>' +
      '<div class="save-bar"><button class="btn primary" type="submit" id="lSave">Guardar</button><button class="btn" type="button" data-act="lback">Cancelar</button><span class="help" id="lMsg" role="status"></span></div>' +
      '</form></div></div>';
    $("#lCat").value = p.categoria;
    drawLugFoto();
    $("#lFoto").addEventListener("change", function (e) { var f = e.target.files[0]; if (f) { lugFoto = { file: f, preview: URL.createObjectURL(f) }; drawLugFoto(); } e.target.value = ""; });
    $("#lf").addEventListener("submit", saveLugar);
    window.scrollTo(0, 0);
  }
  function drawLugFoto() {
    $("#lph").innerHTML = lugFoto ? '<div class="ph"><img src="' + esc(lugFoto.preview || lugFoto.url) + '" alt=""><div class="tools"><span></span><button type="button" data-act="lph-del" aria-label="Quitar foto">✕</button><span></span></div></div>' : '';
  }
  function saveLugar(e) {
    e.preventDefault();
    var btn = $("#lSave"), msg = $("#lMsg"); btn.disabled = true; msg.textContent = lugFoto && lugFoto.file ? "Subiendo foto…" : "Guardando…";
    var up = lugFoto && lugFoto.file ? upload(lugFoto, 0, "lugares/" + Date.now()) : Promise.resolve(lugFoto ? lugFoto.url : null);
    up.then(function (url) {
      var row = { nombre: $("#lNombre").value.trim(), categoria: $("#lCat").value, ciudad: $("#lCiudad").value.trim(), direccion: $("#lDir").value.trim() || null,
        desc_es: $("#lDesc").value.trim() || null, tip_es: $("#lTip").value.trim() || null,
        desc_en: $("#lDescEn").value.trim() || null, tip_en: $("#lTipEn").value.trim() || null,
        desc_fr: $("#lDescFr").value.trim() || null, tip_fr: $("#lTipFr").value.trim() || null,
        foto: url, publicado: $("#lPub").checked, vip: $("#lVip").checked };
      var q = lugEditing === "new" ? sb.from("lugares").insert(row) : sb.from("lugares").update(row).eq("id", lugEditing);
      return q.then(function (r) { if (r.error) throw r.error; loadLugares('Guardado: "' + row.nombre + '".'); });
    }).catch(function (err) { btn.disabled = false; msg.textContent = "No se pudo guardar: " + (err.message || err) + ". Inténtalo otra vez."; });
  }

  /* ---------- Renta de autos ---------- */
  var TRANS = { manual: "Manual", auto: "Automático", driver: "Con chofer" };
  var autoFoto = null, autoEditing = null;
  function loadAutos(note) {
    sb.from("autos").select("*").order("orden").order("precio").then(function (r) {
      if (r.error) { app.innerHTML = '<div class="panel">' + tabs() + '<p class="msg bad">Error al cargar: ' + esc(r.error.message) + '</p></div>'; return; }
      autos = r.data || []; showAutos(note);
    });
  }
  function showAutos(note) {
    autoEditing = null;
    var items = autos.map(function (a) {
      var del = pendingDelete === a.id ? '<div class="confirm" style="grid-column:1/-1">¿Borrar "' + esc(a.nombre_es) + '" para siempre? <button class="btn small" data-act="adel-yes" data-id="' + a.id + '">Sí, borrar</button><button class="btn small" data-act="adel-no">No</button></div>' : '';
      return '<div class="item"><img src="' + esc(a.foto || FC.FALLBACK) + '" alt="">' +
        '<div><h3>' + esc(a.nombre_es) + '</h3><p class="meta">' + esc(a.modelo || "") + ' · ' + esc(TRANS[a.transmision] || a.transmision) + ' · $' + a.precio + ' por día</p>' +
        '<span class="pill ' + (a.publicado ? 'on">Publicado' : 'off">Oculto') + '</span>' + (a.vip ? ' <span class="pill vip">★ VIP</span>' : '') + '</div>' +
        '<div class="acts"><button class="btn small" data-act="aedit" data-id="' + a.id + '">Editar</button>' +
        '<button class="btn small" data-act="atoggle" data-id="' + a.id + '">' + (a.publicado ? 'Ocultar' : 'Publicar') + '</button>' +
        '<button class="btn small" data-act="adel" data-id="' + a.id + '">Borrar</button></div>' + del + '</div>';
    }).join("");
    app.innerHTML = '<div class="panel">' + tabs() + (note ? '<p class="msg">' + esc(note) + '</p>' : '') +
      '<div class="box"><div class="row-head"><h1>Renta de autos</h1><div class="inline"><a class="btn small" href="index.html#autos" target="_blank">Ver página</a><button class="btn primary" data-act="anew">+ Agregar auto</button></div></div>' +
      '<p class="help" style="font-size:1rem">Los autos que se ofrecen en "Renta de autos". Marca <b>★ VIP</b> los que deben aparecer en las páginas de Servicio VIP.</p>' +
      (autos.length ? '<div class="list">' + items + '</div>' : '<p class="help" style="font-size:1rem">Todavía no hay autos. Mientras tanto la página muestra la lista de ejemplo; en cuanto publiques el primero, la de ejemplo desaparece.</p>') +
      '</div></div>';
  }
  function showAutoForm(a) {
    autoEditing = a ? a.id : "new";
    a = a || { nombre_es: "", nombre_en: "", nombre_fr: "", modelo: "", personas: 4, puertas: 4, maletas: 2, transmision: "auto", precio: "", foto: null, publicado: true, vip: false };
    autoFoto = a.foto ? { url: a.foto } : null;
    app.innerHTML = '<div class="panel"><div class="box"><div class="row-head"><h1>' + (autoEditing === "new" ? "Agregar auto" : "Editar auto") + '</h1><button class="btn small" data-act="aback">← Volver</button></div>' +
      '<form class="form" id="af">' +
      '<label for="aNombre">Nombre o categoría<input id="aNombre" required value="' + esc(a.nombre_es) + '" placeholder="Ej. Mercedes-Benz Clase E con chofer"></label>' +
      '<label for="aModelo">Modelo (opcional)<input id="aModelo" value="' + esc(a.modelo || "") + '" placeholder="Ej. Mercedes-Benz E300 o similar"></label>' +
      '<details' + (a.nombre_en || a.nombre_fr ? ' open' : '') + '><summary>Inglés y francés (opcional)</summary><div class="form"><p class="help">Si lo dejas vacío, se muestra el nombre en español.</p>' +
        '<label for="aNomEn">Nombre en inglés<input id="aNomEn" value="' + esc(a.nombre_en || "") + '"></label><label for="aNomFr">Nombre en francés<input id="aNomFr" value="' + esc(a.nombre_fr || "") + '"></label></div></details>' +
      '<div class="g4"><label for="aPrecio">Precio por día (USD)<input id="aPrecio" type="number" min="0" required value="' + esc(a.precio) + '"></label>' +
      '<label for="aPers">Personas<input id="aPers" type="number" min="1" required value="' + esc(a.personas) + '"></label>' +
      '<label for="aPuertas">Puertas<input id="aPuertas" type="number" min="2" required value="' + esc(a.puertas) + '"></label>' +
      '<label for="aMaletas">Maletas<input id="aMaletas" type="number" min="0" required value="' + esc(a.maletas) + '"></label></div>' +
      '<label for="aTrans">Tipo<select id="aTrans"><option value="auto">Automático</option><option value="manual">Manual</option><option value="driver">Con chofer</option></select></label>' +
      '<div><p style="font-weight:600;margin-bottom:8px">Foto</p><div class="photos" id="aph"></div>' +
        '<label class="drop" for="aFoto" style="margin-top:10px;display:block;cursor:pointer">Toca aquí para elegir una foto<input id="aFoto" type="file" accept="image/*" hidden></label></div>' +
      '<label class="vip-check"><input id="aVip" type="checkbox"' + (a.vip ? ' checked' : '') + '> <span><b>★ VIP</b> — aparece en las páginas de Servicio VIP</span></label>' +
      '<label style="display:flex;align-items:center;gap:10px;font-weight:600"><input id="aPub" type="checkbox" style="width:auto"' + (a.publicado ? ' checked' : '') + '> Publicado (se ve en la página)</label>' +
      '<div class="save-bar"><button class="btn primary" type="submit" id="aSave">Guardar</button><button class="btn" type="button" data-act="aback">Cancelar</button><span class="help" id="aMsg" role="status"></span></div>' +
      '</form></div></div>';
    $("#aTrans").value = a.transmision;
    drawAutoFoto();
    $("#aFoto").addEventListener("change", function (e) { var f = e.target.files[0]; if (f) { autoFoto = { file: f, preview: URL.createObjectURL(f) }; drawAutoFoto(); } e.target.value = ""; });
    $("#af").addEventListener("submit", saveAuto);
    window.scrollTo(0, 0);
  }
  function drawAutoFoto() {
    $("#aph").innerHTML = autoFoto ? '<div class="ph"><img src="' + esc(autoFoto.preview || autoFoto.url) + '" alt=""><div class="tools"><span></span><button type="button" data-act="aph-del" aria-label="Quitar foto">✕</button><span></span></div></div>' : '';
  }
  function saveAuto(e) {
    e.preventDefault();
    var btn = $("#aSave"), msg = $("#aMsg"); btn.disabled = true; msg.textContent = autoFoto && autoFoto.file ? "Subiendo foto…" : "Guardando…";
    var up = autoFoto && autoFoto.file ? upload(autoFoto, 0, "autos/" + Date.now()) : Promise.resolve(autoFoto ? autoFoto.url : null);
    up.then(function (url) {
      var row = { nombre_es: $("#aNombre").value.trim(), modelo: $("#aModelo").value.trim() || null,
        nombre_en: $("#aNomEn").value.trim() || null, nombre_fr: $("#aNomFr").value.trim() || null,
        precio: +$("#aPrecio").value || 0, personas: +$("#aPers").value || 1, puertas: +$("#aPuertas").value || 4, maletas: +$("#aMaletas").value || 0,
        transmision: $("#aTrans").value, foto: url, publicado: $("#aPub").checked, vip: $("#aVip").checked };
      var q = autoEditing === "new" ? sb.from("autos").insert(row) : sb.from("autos").update(row).eq("id", autoEditing);
      return q.then(function (r) { if (r.error) throw r.error; loadAutos('Guardado: "' + row.nombre_es + '".'); });
    }).catch(function (err) { btn.disabled = false; msg.textContent = "No se pudo guardar: " + (err.message || err) + ". Inténtalo otra vez."; });
  }

  /* ---------- Solicitudes de clientes ---------- */
  function loadSols(note) {
    sb.from("solicitudes").select("*").order("creado", { ascending: false }).limit(300).then(function (r) {
      if (r.error) { app.innerHTML = '<div class="panel">' + tabs() + '<p class="msg bad">Error al cargar: ' + esc(r.error.message) + '</p></div>'; return; }
      sols = r.data || []; showSols(note);
    });
  }
  function showSols(note) {
    var nuevas = sols.filter(function (s) { return !s.atendida; }).length;
    var items = sols.map(function (s) {
      var d = new Date(s.creado).toLocaleString("es", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      var del = pendingDelete === s.id ? '<div class="confirm">¿Borrar esta solicitud para siempre? <button class="btn small" data-act="sdel-yes" data-id="' + s.id + '">Sí, borrar</button><button class="btn small" data-act="sdel-no">No</button></div>' : '';
      var tel = (s.telefono || "").replace(/[^\d+]/g, "");
      return '<div class="sol' + (s.atendida ? ' done' : '') + '"><div class="sol-head"><div><h3>' + esc(s.nombre || "Sin nombre") + '</h3><p class="meta">' + esc(d) + ' · ' + esc(s.origen) + '</p></div>' +
        '<span class="pill ' + (s.atendida ? 'off">Atendida' : 'on">Nueva') + '</span></div>' +
        '<p class="sol-contact">' + (s.telefono ? '📞 <a href="tel:' + esc(tel) + '">' + esc(s.telefono) + '</a> · <a href="https://wa.me/' + esc(tel.replace("+", "")) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
        (s.email ? (s.telefono ? ' &nbsp; ' : '') + '✉️ <a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>' : '') + '</p>' +
        '<pre class="sol-msg">' + esc(s.mensaje) + '</pre>' +
        '<div class="acts"><button class="btn small" data-act="stoggle" data-id="' + s.id + '">' + (s.atendida ? 'Marcar como nueva' : '✓ Marcar como atendida') + '</button><button class="btn small" data-act="sdel" data-id="' + s.id + '">Borrar</button></div>' + del + '</div>';
    }).join("");
    app.innerHTML = '<div class="panel">' + tabs() + (note ? '<p class="msg">' + esc(note) + '</p>' : '') +
      '<div class="box"><div class="row-head"><h1>Solicitudes</h1><button class="btn small" data-act="sreload">↻ Actualizar</button></div>' +
      '<p class="help" style="font-size:1rem">Lo que los clientes envían desde la página (Mi solicitud, reservas de casas y eVisa). También te llega cada una por correo. ' + (nuevas ? '<b>' + nuevas + ' sin atender.</b>' : '') + '</p>' +
      (sols.length ? '<div class="sols">' + items + '</div>' : '<p class="help" style="font-size:1rem">Todavía no hay solicitudes.</p>') + '</div></div>';
  }

  /* ---------- Botones ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), i = +b.getAttribute("data-i");
    var p = props.filter(function (x) { return x.id === id; })[0];
    var lp = lugares.filter(function (x) { return x.id === id; })[0];
    if (act === "tab") { tab = b.getAttribute("data-tab"); pendingDelete = null; showList(); return; }
    var ap = autos.filter(function (x) { return x.id === id; })[0];
    var sp = sols.filter(function (x) { return x.id === id; })[0];
    if (act === "sreload") return loadSols();
    if (act === "stoggle") return sb.from("solicitudes").update({ atendida: !sp.atendida }).eq("id", id).then(function () { loadSols(); });
    if (act === "sdel") { pendingDelete = id; return showSols(); }
    if (act === "sdel-no") { pendingDelete = null; return showSols(); }
    if (act === "sdel-yes") { pendingDelete = null; return sb.from("solicitudes").delete().eq("id", id).then(function (r) { loadSols(r.error ? "No se pudo borrar: " + r.error.message : "Solicitud borrada."); }); }
    if (act === "anew") return showAutoForm(null);
    if (act === "aedit") return showAutoForm(ap);
    if (act === "aback") { pendingDelete = null; return showAutos(); }
    if (act === "atoggle") return sb.from("autos").update({ publicado: !ap.publicado }).eq("id", id).then(function () { loadAutos(ap.publicado ? "Auto oculto." : "Auto publicado."); });
    if (act === "adel") { pendingDelete = id; return showAutos(); }
    if (act === "adel-no") { pendingDelete = null; return showAutos(); }
    if (act === "adel-yes") { pendingDelete = null; return sb.from("autos").delete().eq("id", id).then(function (r) { loadAutos(r.error ? "No se pudo borrar: " + r.error.message : "Auto borrado."); }); }
    if (act === "aph-del") { autoFoto = null; return drawAutoFoto(); }
    if (act === "lnew") return showLugarForm(null);
    if (act === "ledit") return showLugarForm(lp);
    if (act === "lback") { pendingDelete = null; return showLugares(); }
    if (act === "ltoggle") return sb.from("lugares").update({ publicado: !lp.publicado }).eq("id", id).then(function () { loadLugares(lp.publicado ? "Lugar oculto." : "Lugar publicado."); });
    if (act === "ldel") { pendingDelete = id; return showLugares(); }
    if (act === "ldel-no") { pendingDelete = null; return showLugares(); }
    if (act === "ldel-yes") { pendingDelete = null; return sb.from("lugares").delete().eq("id", id).then(function (r) { loadLugares(r.error ? "No se pudo borrar: " + r.error.message : "Lugar borrado."); }); }
    if (act === "lph-del") { lugFoto = null; return drawLugFoto(); }
    if (act === "new") showForm(null);
    else if (act === "edit") showForm(p);
    else if (act === "back") { pendingDelete = null; showList(); }
    else if (act === "toggle") sb.from("propiedades").update({ publicado: !p.publicado }).eq("id", id).then(function () { loadList(p.publicado ? "Propiedad oculta." : "Propiedad publicada."); });
    else if (act === "del") { pendingDelete = id; showList(); }
    else if (act === "del-no") { pendingDelete = null; showList(); }
    else if (act === "del-yes") { pendingDelete = null; sb.from("propiedades").delete().eq("id", id).then(function (r) { loadList(r.error ? "No se pudo borrar: " + r.error.message : "Propiedad borrada."); }); }
    else if (act === "team-del") sb.from("equipo").delete().eq("email", b.getAttribute("data-email")).then(loadTeam);
    else if (act === "ph-del") { photos.splice(i, 1); drawPhotos(); }
    else if (act === "ph-left" && i > 0) { photos.splice(i - 1, 0, photos.splice(i, 1)[0]); drawPhotos(); }
    else if (act === "ph-right" && i < photos.length - 1) { photos.splice(i + 1, 0, photos.splice(i, 1)[0]); drawPhotos(); }
  });
})();
</script>
