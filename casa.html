<style>
.back { display: inline-flex; align-items: center; gap: 6px; margin-top: 22px; font-weight: 700; color: var(--fg); text-decoration: none; }
.back:hover { text-decoration: underline; }
.ph-title { margin-top: 14px; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.02em; line-height: 1.15; }
.ph-sub { margin-top: 6px; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.ph-sub a { color: var(--fg); }

.gallery { position: relative; margin-top: 20px; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 210px 210px; gap: 8px; border-radius: 20px; overflow: hidden; }
.gallery button { padding: 0; border: 0; background: var(--teal-soft); cursor: zoom-in; min-width: 0; overflow: hidden; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .2s; }
.gallery button:hover img { filter: brightness(.9); }
.gallery button:first-child { grid-row: span 2; }
.gallery .all { position: absolute; right: 14px; bottom: 14px; font: inherit; font-weight: 700; font-size: .9rem; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
.gallery.n1 { grid-template-columns: 1fr; grid-template-rows: 420px; }
.gallery.n2, .gallery.n3, .gallery.n4 { grid-template-columns: 2fr 1fr; }

.ph-main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; margin-top: 32px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); font-weight: 600; }
.facts span { display: inline-flex; align-items: center; gap: 8px; }
.facts svg, .amen svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ph-block { padding-block: 24px; border-bottom: 1px solid var(--line); }
.ph-block h2 { font-size: 1.3rem; margin-bottom: 12px; }
.ph-block p { max-width: 65ch; line-height: 1.65; }
.amen { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px 24px; list-style: none; margin: 0; padding: 0; }
.amen li { display: flex; align-items: center; gap: 12px; }
.map-link { display: inline-flex; margin-top: 12px; font-weight: 700; color: var(--coral); }

.book { position: sticky; top: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: 0 6px 24px rgba(0, 0, 0, .1); display: grid; gap: 14px; }
.book .pr { font-size: 1.1rem; }
.book .pr strong { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.book .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; gap: 10px; }
.sum .tot { font-weight: 800; padding-top: 8px; border-top: 1px solid var(--line); }
.book .btn { width: 100%; }
.book .note { font-size: .85rem; color: var(--muted); text-align: center; }
.err { color: var(--coral); font-size: .9rem; font-weight: 600; min-height: 1.2em; }

.lb { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: grid; grid-template-rows: auto 1fr auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lb-top { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 700; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; min-height: 0; }
.lb-mid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; min-height: 0; gap: 8px; }
.lb-mid > div { height: 100%; min-height: 0; display: flex; }
.lb button { font: inherit; font-weight: 700; color: #fff; background: rgba(255, 255, 255, .14); border: 0; border-radius: 999px; width: 46px; height: 46px; cursor: pointer; font-size: 1.3rem; }
.lb button:hover { background: rgba(255, 255, 255, .28); }
.lb .close { width: auto; padding: 0 16px; font-size: 1rem; }

.nf { padding-block: 80px; text-align: center; display: grid; gap: 14px; justify-items: center; }

@media (max-width: 900px) {
  .ph-main { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .book { position: static; }
  .gallery, .gallery.n1, .gallery.n2, .gallery.n3, .gallery.n4 { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 16px; grid-template-rows: none; }
  .gallery button { flex: 0 0 88%; height: 260px; scroll-snap-align: start; border-radius: 12px; }
  .gallery button:first-child { grid-row: auto; }
  .gallery .all { display: none; }
}

        '<div class="ph-block"><h2>' + esc(T("where_h")) + '</h2><p>' + esc(T("where_p", { c: p.ciudad })) + '</p><a class="map-link" href="' + mapUrl + '" target="_blank" rel="noopener">' + esc(T("map")) + ' →</a></div>' +
      '</div>' +
      '<aside class="book">' +
        '<div class="pr"><strong>$' + p.precio + '</strong> ' + esc(T("per_night")) + '</div>' +
        '<div class="two"><label for="bIn">' + esc(T("checkin")) + '<input id="bIn" type="date" min="' + today(0) + '"></label>' +
        '<label for="bOut">' + esc(T("checkout")) + '<input id="bOut" type="date" min="' + today(1) + '"></label></div>' +
        '<label for="bGuests">' + esc(T("guests_l")) + '<input id="bGuests" type="number" min="1" max="' + (p.personas || 20) + '" value="2"></label>' +
        '<label for="bName">' + esc(T("name_l")) + '<input id="bName" type="text" autocomplete="name" placeholder="' + esc(T("name_ph")) + '"></label>' +
        '<div class="sum" id="bSum"></div><p class="err" id="bErr" role="status"></p>' +
        '<a class="btn primary" id="bAsk" href="https://wa.me/" target="_blank" rel="noopener">' + esc(T("ask")) + '</a>' +
        '<p class="note">' + esc(T("note")) + '</p>' +
      '</aside></div>' +
      (others.length ? '<section style="padding-top:48px"><div class="sec-head"><h2>' + esc(T("others")) + '</h2></div><div class="grid">' + others.map(function (o) {
        var on = FC.titulo(o, lang), href = "casa.html?id=" + encodeURIComponent(o.id);
        return '<article class="card"><a class="card-link" href="' + href + '">' + img(FC.foto(o), on, true).replace("<img ", '<img class="photo" ') + '</a>' +
          '<div class="body"><span class="tag">' + esc(T(o.tipo)) + ' · ' + esc(o.ciudad) + '</span><h3><a class="card-link" href="' + href + '">' + esc(on) + '</a></h3>' +
          '<div class="price"><div><strong>$' + o.precio + '</strong> <span>' + esc(T("per_night")) + '</span></div><a class="btn small" href="' + href + '">' + esc(T("see")) + '</a></div></div></article>';
      }).join("") + '</div></section>' : '');
    if (keep.a) $("#bIn").value = keep.a; if (keep.b) $("#bOut").value = keep.b; if (keep.g) $("#bGuests").value = keep.g; if (keep.n) $("#bName").value = keep.n;
    ["#bIn", "#bOut", "#bGuests", "#bName"].forEach(function (s) { $(s).addEventListener("input", updateBook); });
    $("#bIn").addEventListener("change", function () { var a = $("#bIn").value; if (a) { $("#bOut").min = a; if ($("#bOut").value && $("#bOut").value <= a) $("#bOut").value = ""; } updateBook(); });
    updateBook();
  }

  function fmt(v) { return new Date(v + "T00:00:00").toLocaleDateString({ es: "es", en: "en-US", fr: "fr" }[lang], { day: "numeric", month: "long", year: "numeric" }); }
  function updateBook() {
    var p = prop, a = $("#bIn").value, b = $("#bOut").value, g = $("#bGuests").value, n = $("#bName").value.trim();
    var nights = 0, err = "";
    if (a && b) { nights = Math.round((new Date(b) - new Date(a)) / 86400000); if (nights <= 0) { err = T("err_dates"); nights = 0; } }
    $("#bErr").textContent = err;
    var sum = "";
    if (nights > 0) sum = '<div><span>$' + p.precio + ' × ' + esc(nights === 1 ? T("nights1") : T("nightsN", { n: nights })) + '</span><span>$' + (p.precio * nights) + '</span></div>' +
      '<div class="tot"><span>' + esc(T("total")) + '</span><span>$' + (p.precio * nights) + ' USD</span></div>';
    $("#bSum").innerHTML = sum;
    var lines = [T("m_hello"), "- " + FC.titulo(p, lang) + " (" + p.ciudad + ")", T("m_link") + ": " + location.href.split("#")[0]];
    if (a && b && nights > 0) { lines.push(T("m_dates") + ": " + fmt(a) + " → " + fmt(b)); lines.push(T("m_nights") + ": " + nights); lines.push(T("m_total") + ": $" + (p.precio * nights) + " USD"); }
    if (g) lines.push(T("m_pers") + ": " + g);
    if (n) lines.push(T("m_name") + ": " + n);
    lines.push(T("m_thanks"));
    var base = FC.CONFIG.whatsapp ? "https://wa.me/" + FC.CONFIG.whatsapp : "https://wa.me/";
    $("#bAsk").setAttribute("href", base + "?text=" + encodeURIComponent(lines.join("\n")));
  }

  /* Visor de fotos */
  function openLb(i) { lbIndex = i; $("#lb").hidden = false; document.body.style.overflow = "hidden"; showLb(); $("#lbClose").focus(); }
  function closeLb() { $("#lb").hidden = true; document.body.style.overflow = ""; }
  function showLb() {
    var f = prop.fotos && prop.fotos.length ? prop.fotos : [FC.FALLBACK];
    lbIndex = (lbIndex + f.length) % f.length;
    $("#lbImg").src = f[lbIndex]; $("#lbImg").alt = FC.titulo(prop, lang);
    $("#lbCount").textContent = (lbIndex + 1) + " / " + f.length;
  }
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-ph]"); if (b) openLb(+b.getAttribute("data-ph")); });
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function () { lbIndex--; showLb(); });
  $("#lbNext").addEventListener("click", function () { lbIndex++; showLb(); });
  document.addEventListener("keydown", function (e) {
    if ($("#lb").hidden) return;
    if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") { lbIndex--; showLb(); } else if (e.key === "ArrowRight") { lbIndex++; showLb(); }
  });

  /* Día / Noche */
  var root = document.documentElement, tb = $("#themeBtn");
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function paintTheme() { var d = root.getAttribute("data-theme") === "dark"; tb.innerHTML = d ? SUN + " " + esc(T("day")) : MOON + " " + esc(T("night")); tb.setAttribute("aria-label", d ? T("to_day") : T("to_night")); }
  function setTheme(t) { root.setAttribute("data-theme", t); paintTheme(); try { localStorage.setItem("fc-theme", t); } catch (e) {} }
  var st = "light"; try { st = localStorage.getItem("fc-theme") || "light"; } catch (e) {}
  setTheme(st === "dark" ? "dark" : "light");
  tb.addEventListener("click", function () { setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  /* Idioma */
  function applyLang(l) {
    lang = TX[l] ? l : "es"; root.setAttribute("lang", lang); FC.guardarIdioma(lang);
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T(el.getAttribute("data-i18n")); });
    document.querySelectorAll(".lang").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    paintTheme();
    if (prop !== undefined && $("#page").dataset.ready) render();
  }
  document.querySelectorAll(".lang").forEach(function (b) { b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); }); });
  applyLang(lang);

  /* Cargar la propiedad */
  var id = new URLSearchParams(location.search).get("id");
  FC.cargar().then(function (list) {
    prop = null;
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) prop = list[i];
    others = list.filter(function (o) { return o !== prop; }).slice(0, 3);
    $("#page").dataset.ready = "1";
    render();
  });
})();
</script>
</body>
</html>
